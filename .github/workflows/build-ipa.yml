name: Build signed IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Validate signing secrets
        env:
          CERT: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$CERT" || (echo "Missing IOS_CERTIFICATE_P12_BASE64" && exit 1)
          test -n "$PROFILE" || (echo "Missing IOS_PROVISIONING_PROFILE_BASE64" && exit 1)
          test -n "$CERT_PASSWORD" || (echo "Missing IOS_CERTIFICATE_PASSWORD" && exit 1)

      - name: Create temporary keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -e
          PASS="${KEYCHAIN_PASSWORD:-unixgram-ci-keychain}"
          security create-keychain -p "$PASS" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$PASS" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          echo "KEYCHAIN_PASSWORD_EFFECTIVE=$PASS" >> "$GITHUB_ENV"

      - name: Import Apple Development certificate
        env:
          CERT_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -e
          echo "$CERT_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD_EFFECTIVE" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_BASE64" | base64 --decode > profile.mobileprovision

          security cms -D -i profile.mobileprovision > profile.plist
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' profile.plist)
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' profile.plist)
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' profile.plist)
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' profile.plist)

          cp profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "PROFILE_APP_ID=$APP_ID" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

      - name: Patch project for manual signing
        run: |
          set -e
          BUNDLE_ID="${PROFILE_APP_ID#*.}"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"

          python3 - <<'PY'
          from pathlib import Path
          import os, re

          p = Path("project.yml")
          s = p.read_text()

          bundle = os.environ["BUNDLE_ID"]
          team = os.environ["TEAM_ID"]
          profile = os.environ["PROFILE_NAME"]

          s = re.sub(r'PRODUCT_BUNDLE_IDENTIFIER:\s*.*', f'PRODUCT_BUNDLE_IDENTIFIER: {bundle}', s)
          s = re.sub(r'MARKETING_VERSION:\s*".*?"', 'MARKETING_VERSION: "0.8.0"', s)
          s = re.sub(r'CURRENT_PROJECT_VERSION:\s*".*?"', 'CURRENT_PROJECT_VERSION: "8"', s)

          cleaned = []
          for line in s.splitlines():
              if any(k in line for k in [
                  "CODE_SIGNING_ALLOWED:",
                  "CODE_SIGNING_REQUIRED:",
                  "CODE_SIGN_IDENTITY:",
                  "DEVELOPMENT_TEAM:",
                  "CODE_SIGN_STYLE:",
                  "PROVISIONING_PROFILE_SPECIFIER:",
              ]):
                  continue
              cleaned.append(line)

          out = "\n".join(cleaned)
          marker = "        SUPPORTS_MACCATALYST: NO"
          signing = (
              marker + "\n"
              + "        CODE_SIGN_STYLE: Manual\n"
              + f"        DEVELOPMENT_TEAM: {team}\n"
              + "        CODE_SIGN_IDENTITY: Apple Development\n"
              + f'        PROVISIONING_PROFILE_SPECIFIER: "{profile}"'
          )
          out = out.replace(marker, signing)
          p.write_text(out + "\n")
          PY

          xcodegen generate

      - name: Build signed iPhone app
        run: |
          set -o pipefail
          rm -rf build Payload Unixgram-signed.ipa
          mkdir -p build

          xcodebuild \
            -project UnixgramFork.xcodeproj \
            -scheme UnixgramFork \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Development" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            build | tee build/build.log

      - name: Verify signature and provisioning
        run: |
          set -e
          APP_PATH="$(find "$PWD/build/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          codesign -vvv --deep --strict "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" 2>&1 | tee build/entitlements.txt
          test -f "$APP_PATH/embedded.mobileprovision"
          security cms -D -i "$APP_PATH/embedded.mobileprovision" > build/embedded-profile.plist

      - name: Package signed IPA
        run: |
          set -e
          rm -rf Payload Unixgram-signed.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/ditto -c -k --keepParent Payload Unixgram-signed.ipa

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: Unixgram-v0.8-SIGNED-IPA
          path: Unixgram-signed.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signing-diagnostics-v0.8
          path: |
            build/build.log
            build/entitlements.txt
            build/embedded-profile.plist
          if-no-files-found: ignore
